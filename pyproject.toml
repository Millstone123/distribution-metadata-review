[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-metadata-review"
version = "1.1.0"
description = "Deterministic review reports for Python distribution metadata"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dist-meta-review = "distribution_metadata_review.cli:main"

[tool.setuptools.packages.find]
include = ["distribution_metadata_review*"]

